name: RF Runtime Sync

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Runtime repo branch to pull from"
        required: false
        default: "ci/termux-safe-runtime"

jobs:
  sync-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RobotForest repo
        uses: actions/checkout@v4

      - name: Ensure jq and gh are available
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          if ! command -v gh >/dev/null 2>&1; then
            echo "[rf-sync] Installing GitHub CLI..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Sync rf-runtime-dev.tar.zst from runtime repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Optional: allow overriding branch via workflow input
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            export BRANCH="${{ github.event.inputs.branch }}"
          fi
        ./scripts/runtime/rf_sync_runtime_local.sh1
