name: RF Runtime Sync

on:
  workflow_dispatch:
    inputs:
      runtime-branch:
        description: 'Branch in robotforest-wow64-runtime to pull rf-runtime-dev from'
        required: false
        default: 'ci/termux-safe-runtime'

jobs:
  sync-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RobotForest
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Sync rf-runtime-dev.tar.zst from runtime repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_BRANCH: ${{ inputs.runtime-branch }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ./scripts/runtime/rf_sync_runtime_ci.sh
