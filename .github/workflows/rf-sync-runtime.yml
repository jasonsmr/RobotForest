name: RF Runtime Sync

on:
  workflow_dispatch:

jobs:
  sync-runtime:
    runs-on: ubuntu-latest

    env:
      # GitHub CLI will pick this up automatically
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout RobotForest repo
        uses: actions/checkout@v4

      - name: Install tools (jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Sync rf-runtime-dev from runtime repo
        env:
          # Default runtime repo; script can override via env/flags if needed
          RUNTIME_REPO: jasonsmr/robotforest-wow64-runtime
        run: |
          set -euo pipefail
          scripts/runtime/rf_sync_runtime_local.sh
